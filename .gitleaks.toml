# gitleaks configuration for the `just lint` secret gate.
#
# **`gitleaks dir` does not honour .gitignore.** Measured, with a real
# `ghp_`-shaped token as a canary: planted under `mutants/`, `.venv/` and
# `.tools/`, every one of them was reported. The scanned-bytes figure gitleaks
# prints is not evidence to the contrary -- it counts decoded text.
#
# Without this file the gate therefore reads other people's code: every
# dependency in `.venv/`, the pinned binaries in `.tools/`, and mutmut's
# scratch copy of the tree. That is wrong twice over. It is slow, and a test
# fixture inside somebody else's package -- the kind of file that exists to look
# like a credential -- would turn `just lint` red for a secret this repository
# does not contain and cannot remove.
#
# **Written as an exclusion rather than an inclusion, deliberately.** Naming the
# directories we own would mean a new top-level file is silently unscanned until
# somebody remembers to add it, which is the fail-open shape this repo rejects
# elsewhere. Excluding what is demonstrably not ours means anything new is
# covered by default and the gate fails closed.
#
# Passed with `-c` from scripts/lint.sh rather than left to be discovered. It is
# the fourth of gitleaks' four config sources, found by looking beside the target
# path -- so a rename or a move would silently fall back to the default config
# and this file would stop applying with nothing to say so. The explicit flag
# turns that into a startup error.

[extend]
# The upstream ruleset is the point of using gitleaks at all; this file only
# narrows where it looks.
useDefault = true

[allowlist]
description = "Paths that are not this repository's source"
paths = [
    # Every one of these is gitignored, and gitleaks scans them anyway.
    '''^\.venv/''',              # dependencies -- 103 MB
    '''^\.tools/''',             # pinned tool binaries
    '''^mutants/''',             # mutmut's copied tree, rebuilt by every run
    '''^\.cache/''',             # uv cache, scan archives, delivery bundles
    '''^\.hypothesis/''',        # property-test example database
    '''^\.claude/worktrees/''',  # a second checkout of this tree, inside this tree
    '''^\.git/''',               # object store: `gitleaks git` is the tool for history
]
