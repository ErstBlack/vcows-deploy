[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcows-deploy"
version = "0.1.0.0"
description = "Deploy pre-built golden qcow2 images as VMs to KVM/libvirt over qemu+ssh"
requires-python = ">=3.12"

# Declared for tooling and for the build manifest. **The image installs none of
# this via pip.** Every runtime dependency exists as an RPM, so the container
# installs them from a local repo mirror and carries no pip, no virtualenv and no
# vendored wheels -- one air-gap mechanism instead of two:
#
#   jsonschema  -> python3-jsonschema  (appstream)
#   PyYAML      -> python3-pyyaml      (appstream)
#   pycdlib     -> python3-pycdlib     (epel; 1.16.0 verified against the A1 API)
#   libvirt     -> python3-libvirt     (appstream)
#
# `libvirt-python` is absent from this list on purpose: PyPI publishes sdist
# only, so pip would need gcc and network access. Because there is no virtualenv
# in the image, the --system-site-packages trap that would otherwise hide the RPM
# binding cannot arise there.
#
# A *dev* environment hits it twice, so create it exactly like this:
#
#     uv venv --python /usr/bin/python3 --system-site-packages
#
# Without --system-site-packages the RPM binding is invisible. And without the
# explicit interpreter, uv installs its own managed CPython (3.13 at the time of
# writing), whose site-packages contains no RPMs at all -- so the flag appears to
# work while `import libvirt` still fails. `uv sync` cannot express either, which
# is why this project uses `uv venv` + `uv pip install`. The lockfile is still
# honoured -- `just dev-env` exports uv.lock and installs the export, so the
# bounds below constrain `uv lock`, not what any environment ends up with.
dependencies = [
    "jsonschema>=4.19",
    "PyYAML>=6.0",
    "pycdlib>=1.16",
]

[project.scripts]
vcows = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mutmut>=3.7.0",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    # Shuffles the suite every run, so an ordering dependency fails somebody's
    # build rather than waiting to fail a release. It found one immediately:
    # `tests/test_seam.py` deleted `orchestrator*` from `sys.modules` without
    # restoring it, which left two copies of every core class loaded and made
    # `Severity.WARNING != Severity.WARNING` for anything that ran afterwards.
    # That is also why `mutmut` could never finish its clean baseline.
    #
    # mutmut passes `-p no:randomly` on every pytest invocation it makes, so
    # mutant runs stay in declaration order and are still comparable to each
    # other. Pass the same flag by hand when bisecting a failure that only
    # appears under one seed.
    "pytest-randomly>=4.1.0",
    "ruff>=0.16",
    # Exact, not a bound. ty is 0.0.x and its own documentation says breaking
    # changes may occur between any two versions, so `~=0.0.75` would still admit
    # the releases this project has reason to fear. Everything else here is fixed
    # the same way -- four Containerfile digests, six tool digests, the provider
    # h1: hash -- and a bump is a deliberate edit CI exercises.
    "ty==0.0.75",
    # PyYAML ships no inline types and jsonschema/pycdlib are both PEP 561, so
    # this is the one stub gap worth closing. `libvirt.py` is the permanent
    # ceiling -- the RPM binding is untyped and has no stub package anywhere.
    "types-PyYAML>=6",
]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.coverage.run]
branch = true
source = ["orchestrator", "container"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
# Build-time only. `packages()` shells out to `rpm -qa` and `tofu_version()` to
# `tofu version -json`, and `main()` is the assembly of the two -- none of them
# can run outside the image, and what actually asserts this file's output is
# `test_image.test_the_build_manifest_records_what_shipped`, behind the image
# gate. `container/entrypoint.py` stays measured: it writes ~/.ssh/config from
# operator-supplied strings and is the half worth a floor.
#
# The cost, recorded so this does not read as an oversight: `git_sha()` and
# `provider()` are unit-tested today and lose their floor along with the rest of
# the file, and two measured behaviours stay asserted nowhere -- the `(none)`
# sentinel filter (rpm renders an absent tag as that truthy literal, and the
# conditional query format was measured not to help on rpm 4.19.1.1) and the
# `source_rpms` deduplication. The way back in is tests for those two, not a
# lower `fail_under`.
omit = ["container/manifest.py"]
# `just test` passes `--cov`, and `just test` is inside `just check`, so this is a
# real gate on every developer run and on CI -- see docs/ci.md.
#
# The floor sits below the measured figure on purpose, because the figure depends
# on which gates ran: CI's `check` job has no provider mirror, so the tests behind
# `needs_tofu` skip there and legitimately cover less. A floor that assumed the
# best case would fail honest runs, which is how a coverage gate gets turned off.
# What makes 90 safe rather than vacuous is that the mirror-gated tests are the
# HCL, rig and image ones: `tests/test_tofu_driver.py`, which is what actually
# covers `tofu.py`, is ungated and runs everywhere.
fail_under = 90

[tool.mutmut]
# Both packages that ship, not just the one. `container/` is small but it is
# where the entrypoint writes ~/.ssh/config, which is the code an S1 injection
# finding was filed against -- exactly the place a surviving mutant matters.
# It also has to be here for a second reason: mutmut runs the suite from a copied
# tree, and tests/test_entrypoint.py imports `container`, so leaving it out makes
# collection fail rather than merely skipping it.
source_paths = ["orchestrator", "container"]
# mutmut runs the suite from a copy of the tree at `mutants/`, and only what it
# copies exists there. It appends `tests/`, `pyproject.toml` and the lock files to
# this list itself, so none of those need naming. These two do: the manifest and
# module tests read the committed provider lock and the pinned provider schema out
# of `docs/`, and without them they fail inside every run, which mutmut reports as
# "failed to collect stats" rather than as a missing file.
#
# Still not copied, and so still a trap: `scripts/`, `licenses/`, `justfile` and
# `.tools/`. Nothing reads them unless a run sets `VCOWS_GATES`, which is why this
# has never bitten -- `conftest.MIRROR` simply resolves under `mutants/`, is
# absent, and `needs_tofu` degrades to a skip.
also_copy = ["docs", "Containerfile"]
# `tests/test_scripts.py` runs `scripts/*.sh` under bash and symlinks the repo's
# `.venv` into a scratch tree, and neither `scripts/` nor `.venv` exists under
# `mutants/`. Copying them is the wrong fix: mutmut mutates Python inside
# `source_paths`, that file imports none of it, and so it can kill no mutant --
# running it once per mutant would buy nothing and cost a `ruff` invocation each
# time. Deselected rather than left to fail.
pytest_add_cli_args = ["--deselect", "tests/test_scripts.py"]

# **Why this used to fail, and what fixed it.** `mutmut run` got past mutant
# collection and then died in its own clean-baseline run with
#
#   assert [<Severity.WARNING: 'warning'>] == [<Severity.WARNING: 'warning'>]
#
# -- two enum members that print identically and compare unequal, which means two
# copies of `orchestrator.backends.base` were loaded at once.
#
# It was not sys.path and it was not the editable install; both were investigated
# and neither is the cause. mutmut calls `pytest.main()` **in-process, three times
# in the parent process** before it forks anything (stats, clean baseline, forced
# fail). `tests/test_seam.py` deleted every `orchestrator*` entry from
# `sys.modules` with a plain `del` and re-imported, so the first of those runs left
# a second set of core classes behind. The second run did not re-execute test
# modules already imported, so `tests/fake_backend.py` still held the first
# `Severity` while `tests/test_config.py`'s in-body import got the second.
#
# The fix is in that test file, not here: `monkeypatch.delitem`, so teardown puts
# the originals back. It was a real ordering defect rather than a mutmut quirk --
# `pytest-randomly` trips it too, which is how it stopped being theoretical.
#
# No CI pipeline calls `just mutants`, and that is unchanged: it is a long run
# whose value is a report to read, not a pass/fail a pipeline should block on.

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo'd marker is otherwise a silent no-op, which in a suite whose gates are
# built out of marks is the same failure as a gate that passes by skipping.
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py312"
# Everything under docs/ is archived evidence rather than package code, and all
# of it quotes source verbatim: the spike scripts are reproduced in spikes.md,
# and the review reports cite the code they are findings about. Reformatting any
# of it would make the file and the code it quotes disagree.
#
# ruff formats Python fences inside Markdown, so this covers the reports as well
# as the .py files -- without it a review report quoting an aligned trailing
# comment turns `just lint` red, which is how master broke on 4c00463.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    # The 10 hits in `orchestrator/` today are all reviewed and carry a `# noqa`
    # naming the reason: six parse libvirt's own XMLDesc output, two are
    # argv-list subprocess calls, two are internal-invariant asserts.
    # `container/` carries four more (one S603, two S607, one S606), so the
    # scope is what makes the figure reproducible. The rule earns its place by
    # catching the *next* one, not by re-litigating these.
    "S",        # flake8-bandit
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# SIM300 wants the constant on the right. In a pinning assertion the constant
# under test is the subject, and `assert VCOWS_NS == <expected>` reads better
# than the inversion.
#
# The four bandit rules are inherent to a test suite rather than deliberate
# exceptions: S101 is how pytest works (606 of them), S314 parses fixture XML the
# test itself just wrote, and S603/S607 are the image gate calling `podman` and
# `tofu` by name on purpose. Ignoring them here keeps `S` meaningful in
# orchestrator/, which is the code that ships.
"tests/*" = ["SIM300", "S101", "S314", "S603", "S607"]

[tool.ty.src]
# Archived evidence, not package code (mirrors ruff's extend-exclude).
exclude = ["docs"]

[tool.ty.environment]
python-version = "3.12"
# The libvirt binding comes from the python3-libvirt RPM and is only visible
# through a --system-site-packages venv (see the dependencies note above), so
# point ty at the same interpreter rather than a uv-managed one.
python = ".venv"
