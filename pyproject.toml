[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcows-deploy"
version = "0.1.0.0"
description = "Deploy pre-built golden qcow2 images as VMs to KVM/libvirt over qemu+ssh"
requires-python = ">=3.12"

# Declared for tooling and for the build manifest. **The image installs all but
# one of these as RPMs**, from a local repo mirror, and carries no pip and no
# virtualenv of its own:
#
#   jsonschema        -> python3-jsonschema        (appstream)
#   PyYAML            -> python3-pyyaml            (appstream)
#   pycdlib           -> python3-pycdlib           (epel; 1.16.0)
#   libvirt           -> python3-libvirt           (appstream)
#   requests          -> python3-requests          (appstream; proxmoxer's https backend)
#   requests-toolbelt -> python3-requests-toolbelt (epel; 1.0.0)
#   pyvmomi           -> python3-pyvmomi           (epel; 9.0.0.0)
#
# **`proxmoxer` is the one exception, and it is deliberate.** Measured:
# `dnf repoquery python3-proxmoxer` returns nothing across Rocky 10
# baseos/appstream/crb/extras or EPEL 10 -- `python3-pycdlib` returns a hit from
# the same query, so the absence is real and not a broken lookup -- and repology
# shows no Fedora or RHEL-derived packaging anywhere. It is pure Python with
# `requires_dist: null`, so the image installs one hash-pinned wheel in a build
# stage and copies the result forward; pip never lands in the delivered image.
# See the Containerfile's `pydeps` stage.
#
# `requests` is declared even though proxmoxer does not require it: proxmoxer
# marks it optional, so nothing would install it, and the https backend is the
# only one this project uses.
#
# `requests-toolbelt` is declared for the same kind of reason and is never
# imported by this project: proxmoxer streams a multipart upload only when it can
# import it, and without it the golden image is read whole into memory and
# anything over 2 GiB raises OverflowError.
#
# `libvirt-python` is absent from this list on purpose: PyPI publishes sdist
# only, so pip would need gcc and network access. Because there is no virtualenv
# in the image, the --system-site-packages trap that would otherwise hide the RPM
# binding cannot arise there.
#
# A *dev* environment hits it twice, so create it exactly like this:
#
#     uv venv --python /usr/bin/python3 --system-site-packages
#
# Without --system-site-packages the RPM binding is invisible. And without the
# explicit interpreter, uv installs its own managed CPython, whose site-packages
# contains no RPMs at all -- so the flag appears to work while `import libvirt`
# still fails. `uv sync` cannot express either, which is why this project uses
# `uv venv` + `uv pip install`. The lockfile is still honoured -- `just dev-env`
# exports uv.lock and installs the export, so the bounds below constrain
# `uv lock`, not what any environment ends up with.
dependencies = [
    "jsonschema>=4.19",
    "PyYAML>=6.0",
    "pycdlib>=1.16",
    "proxmoxer>=2.3",
    "pyvmomi>=9.0",
    "requests>=2.32",
    "requests-toolbelt>=1.0",
]

[project.scripts]
vcows = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mutmut>=3.7.0",
    "pytest>=8",
    "pytest-cov>=6",
    # Shuffles the suite every run, so an ordering dependency fails somebody's
    # build rather than waiting to fail a release.
    #
    # mutmut passes `-p no:randomly` on every pytest invocation it makes, so
    # mutant runs stay in declaration order and are still comparable to each
    # other. Pass the same flag by hand when bisecting a failure that only
    # appears under one seed.
    "pytest-randomly>=4.1.0",
    "ruff>=0.16",
    # Exact, not a bound. ty is 0.0.x and its own documentation says breaking
    # changes may occur between any two versions, so `~=0.0.75` would still admit
    # the releases this project has reason to fear. Every other pin here -- the
    # Containerfile's digests, the tool digests in scripts/install-tools.sh --
    # is fixed the same way, and a bump is a deliberate edit CI exercises.
    "ty==0.0.78",
    # PyYAML ships no inline types and jsonschema/pycdlib are both PEP 561, so
    # this is the one stub gap worth closing. `libvirt.py` is the permanent
    # ceiling -- the RPM binding is untyped and has no stub package anywhere.
    "types-PyYAML>=6",
]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.coverage.run]
branch = true
source = ["orchestrator", "container"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
# Nothing is omitted, `container/manifest.py` included. Its `packages()` shells
# out to `rpm -qa` and `main()` is the assembly around it, neither of which can
# run outside the image -- but omitting the file leaves 127 mutants in it that no
# test reaches, more than the rest of both packages put together.
#
# `tests/test_manifest.py` fakes `subprocess.run` and drives all three, which is
# what asserts the `(none)` sentinel filter (rpm renders an absent tag as that
# truthy literal, and the conditional query format was measured not to help on
# rpm 4.19.1.1) and the `source_rpms` deduplication. What the fake cannot say is
# what real rpm prints, so `test_image.test_the_build_manifest_records_what_shipped`
# is what asserts the shipped file, behind the image gate.
# `just test` passes `--cov`, and `just test` is inside `just check`, so this is a
# real gate on every developer run and on CI -- see docs/ci.md.
#
# The floor sits below the measured figure on purpose, because the figure depends
# on which gates ran: the rig and image tests skip on CI's `check` job and it
# legitimately covers less. A floor that assumed the best case would fail honest
# runs, which is how a coverage gate gets turned off.
fail_under = 90

[tool.mutmut]
# Both packages that ship. `container/` is `manifest.py`, and
# `tests/test_manifest.py` imports `container`, so leaving it out makes
# collection fail in mutmut's copied tree rather than merely skipping it.
source_paths = ["orchestrator", "container"]
# mutmut runs the suite from a copy of the tree at `mutants/`, and only what it
# copies exists there. It appends `tests/`, `pyproject.toml` and the lock files to
# this list itself, so none of those need naming.
#
# Still not copied, and so still a trap: `scripts/`, `justfile` and `.tools/`.
# Nothing reads them unless a run sets `VCOWS_GATES`.
# `licenses` is copied because tests/test_manifest.py reads
# licenses/proxmoxer/PROVENANCE.md -- the second record of the wheel's pinned
# version and digest. Without it that test raises FileNotFoundError under
# mutmut and takes the whole run down before it reports anything.
# `config.example.yaml` for the same reason: `tests/test_config.py` loads the
# shipped template to prove it is refused, and a copy without it reports "cannot
# read" against the path instead of the placeholders.
also_copy = ["docs", "Containerfile", "licenses", "config.example.yaml"]
# `tests/test_scripts.py` runs `scripts/*.sh` under bash and symlinks the repo's
# `.venv` into a scratch tree, and neither `scripts/` nor `.venv` exists under
# `mutants/`. Copying them is the wrong fix: mutmut mutates Python inside
# `source_paths`, that file imports none of it, and so it can kill no mutant --
# running it once per mutant would buy nothing and cost a `ruff` invocation each
# time. Deselected rather than left to fail.
pytest_add_cli_args = ["--deselect", "tests/test_scripts.py"]

# **A test must not leave `sys.modules` rewritten.** mutmut calls `pytest.main()`
# in-process, three times in the parent process before it forks anything (stats,
# clean baseline, forced fail). A test that deletes every `orchestrator*` entry
# with a plain `del` and re-imports leaves a second set of core classes behind on
# the first of those runs; the second run does not re-execute test modules
# already imported, so one module holds the first `Severity` while another's
# in-body import gets the second, and the clean baseline dies on
#
#   assert [<Severity.WARNING: 'warning'>] == [<Severity.WARNING: 'warning'>]
#
# -- two enum members that print identically and compare unequal. Use
# `monkeypatch.delitem`, so teardown puts the originals back. This is an ordering
# defect rather than a mutmut quirk: `pytest-randomly` trips it too.

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo'd marker is otherwise a silent no-op, which in a suite whose gates are
# built out of marks is the same failure as a gate that passes by skipping.
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py312"
# Everything under docs/ is archived evidence rather than package code, and it
# quotes source verbatim. Reformatting any of it would make the file and the code
# it quotes disagree.
#
# ruff formats Python fences inside Markdown, so this covers the prose as well as
# the .py files -- without it a document quoting an aligned trailing comment
# turns `just lint` red.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    # Every hit in `orchestrator/` and `container/` carries a `# noqa` naming
    # the reason: parsing libvirt's own XMLDesc output, internal-invariant
    # asserts, argv-list subprocess calls. The rule earns its place by catching
    # the *next* one.
    "S",        # flake8-bandit
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# SIM300 wants the constant on the right. In a pinning assertion the constant
# under test is the subject, and `assert VCOWS_NS == <expected>` reads better
# than the inversion.
#
# The four bandit rules are inherent to a test suite rather than deliberate
# exceptions: S101 is how pytest works, S314 parses fixture XML the test itself
# just wrote, and S603/S607 are the image gate calling `podman` by name on
# purpose. Ignoring them here keeps `S` meaningful in orchestrator/, which is
# the code that ships.
"tests/*" = ["SIM300", "S101", "S314", "S603", "S607"]

[tool.ty.src]
# Archived evidence, not package code (mirrors ruff's extend-exclude).
exclude = ["docs"]

[tool.ty.environment]
python-version = "3.12"
# The libvirt binding comes from the python3-libvirt RPM and is only visible
# through a --system-site-packages venv (see the dependencies note above), so
# point ty at the same interpreter rather than a uv-managed one.
python = ".venv"
