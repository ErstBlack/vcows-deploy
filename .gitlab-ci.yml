# vcows-deploy -- GitLab CI. Written 2026-08-29 against OpenTofu 1.12.6,
# uv 0.12.7 and just 1.46.0, for a self-hosted instance the project has not moved
# to yet. **Never executed.** It is syntax-checked and its recipes are exercised
# by the GitHub pipeline, which is not the same as having run.
#
# It runs exactly the recipes .github/workflows/*.yml run; scripts/lint.sh
# asserts that neither file contains anything else. When the move happens,
# deleting .github/ loses nothing.
#
# Runner assumptions, stated because getting them wrong is how a pipeline hangs
# pending rather than failing:
#   - `linux`  a Docker-executor runner that can reach the package mirrors and
#              the OpenTofu registry. Build-time network only; nothing here
#              resembles what the air-gapped site runs.
#   - `podman` a runner with rootless podman. The image gate needs a runtime, not
#              just a builder -- see scripts/image-build.sh.
#   - artifacts  the instance's "Maximum artifacts size" must exceed ~160 MB. The
#                documented default is 100 MB, measured against the final archive
#                rather than per file, and .cache/delivery/ is 153 MiB (a 151 MB
#                tarball plus a 7 MB SBOM and a 2.3 MB report). Below that, the
#                `image` and `rebuild-scan` jobs do all their work and then lose
#                the artifact the comment at :170-172 calls "what makes the rest
#                of this job worth running". Never executed, so this is from
#                GitLab's documentation, not from a run.
# Every job is tagged. An untagged job on an instance with no matching runner
# hangs pending forever instead of failing, which is the worst of both.

stages: [check, image]

default:
  image: ubuntu:24.04
  tags: [linux]

# One mapping per anchor, deliberately, because a sequence alias spliced into a
# sequence nests: `cache: [*two_entry_anchor, {third}]` parses to `[[a, b], c]`
# and not to three entries. That is why the jobs below each compose the entries
# they want rather than sharing one list. Mappings splice cleanly.
.tools_cache: &tools_cache
  key:
    prefix: tools
    files: [scripts/install-tools.sh, Containerfile]
  paths: [.tools/bin]

.uv_cache: &uv_cache
  key:
    prefix: uv
    files: [pyproject.toml, uv.lock]
  paths: [.cache/uv]

# Keyed on main.tf, which declares the pin, and NOT on
# docs/provider-<v>.lock.hcl, whose filename carries the version: a bump renames
# that file, GitLab substitutes a placeholder for a file it cannot find, and the
# key collapses to a constant -- a stale-mirror hit on exactly the run where the
# mirror changed. docs/ci.md records the same.
# mutmut re-tests only the mutants whose function hash changed, so this is the
# difference between re-running all 3835 and re-running the few an MR touched. A
# stale entry is harmless here, unlike the mirror below: it is only a verdict
# mutmut recomputes, because it hashes each function and resets whatever moved.
# Keyed on the dependency files mutmut's own change detection already watches.
.mutants_cache: &mutants_cache
  key:
    prefix: mutants
    files: [pyproject.toml, uv.lock]
  paths: [mutants]

.mirror_cache: &mirror_cache
  key:
    prefix: tofu-mirror
    files: [orchestrator/backends/libvirt/tofu/main.tf]
  paths: [.tools/tofu-mirror]

.bootstrap: &bootstrap
  - ./scripts/os-deps.sh
  - ./scripts/install-tools.sh
  - just dev-env

check:
  stage: check
  # Ceilings sized against a wedge, not a slow run; the measurement and the
  # reason are in .github/workflows/ci.yml. They are repeated here because
  # .github/ is meant to be deletable at the migration.
  timeout: 15m
  cache: [*tools_cache, *uv_cache]
  script:
    - *bootstrap
    - just check

tofu:
  stage: check
  timeout: 15m
  cache: [*tools_cache, *uv_cache, *mirror_cache]
  script:
    - *bootstrap
    # GitLab's cache is overwritten at the end of every job, so a restored mirror
    # is untrusted input on every run. `ensure-mirror` re-checks it against the
    # Containerfile's digest, and builds one if the cache missed.
    - just ensure-mirror
    - just verify-provider
    - just test-tofu

# Mutation testing: does the suite notice when a line is wrong, not merely run it?
# `just check` enforces a 90% coverage floor and 964 of these mutants live in code
# that floor calls covered.
#
# A gate rather than a report. `mutmut run` exits 0 whatever it finds -- measured:
# 3835 mutants, 964 surviving, exit 0 -- so scripts/mutants.sh compares against
# docs/mutation-baseline.json and fails only when a number rose.
mutation:
  stage: check
  # Measured on 16 cores: 3835 mutants in 156s. A shared runner has fewer, so a
  # cold cache is several times that; the ceiling is sized against a wedge.
  timeout: 30m
  cache: [*tools_cache, *uv_cache, *mutants_cache]
  script:
    - *bootstrap
    - just mutants

# The end-to-end gate. `tofu` above reads the module through a mocked provider;
# this one applies it to a libvirtd installed on the runner and asserts against
# `virsh dumpxml`. The domain runs under TCG, so no /dev/kvm is required and this
# job is the same one .github/workflows/ci.yml runs -- which is the point, since
# GitLab.com's shared runners have no /dev/kvm to offer.
smoke:
  stage: check
  # Explicit rather than inherited, because this job's requirement is stricter
  # than the other `linux` jobs': it starts a system daemon and writes
  # /etc/libvirt, so a Docker-executor runner has to be privileged. That is a
  # runner property no tag can express; see docs/ci.md.
  tags: [linux]
  timeout: 30m
  cache: [*tools_cache, *uv_cache, *mirror_cache]
  # *bootstrap now, where this job used to spell out the two scripts and skip
  # `just dev-env`. The gate's assertions are tests/test_libvirt_smoke.py and the
  # script runs them out of that venv (#122), so the anchor's third line is the
  # one this job was missing rather than the one it had to avoid.
  script:
    - *bootstrap
    - just ensure-mirror
    - just smoke-libvirt

image:
  stage: image
  tags: [podman]
  timeout: 30m
  cache: [*tools_cache]
  # On the default branch, on tags, and on any MR touching the image's inputs.
  # tests/test_image.py is the only thing exercising the air-gap properties, so
  # gating it to post-merge would validate a Containerfile change only after
  # review had already passed on it.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Containerfile
        - .containerignore
        - container/**/*
        - orchestrator/backends/libvirt/tofu/**/*
        - docs/provider-*.lock.hcl
        - licenses/**/*
        - scripts/image-*.sh
        # The gate's own machinery and the file it reads, both of which decide
        # what the job concludes: a change to the CVE baseline suppresses
        # findings, and is the change most in need of running the job that would
        # exercise the suppression. tests/test_image.py is the only thing
        # exercising the air-gap properties, and scripts/lib.sh is sourced by
        # image-build.sh and image-scan.sh alike, while the line above lists only
        # scripts/image-*.sh. These three are inputs to the *decision to run*, not
        # paths the image carries -- scripts/lib.sh's ship= array stays as it is,
        # for the reason its comment gives.
        - docs/cve-baseline.json
        - tests/test_image.py
        - scripts/lib.sh
  script:
    - *bootstrap
    - just mirror
    - just image
    - just test-image
    - just scan
    - just bundle
  # What makes the rest of this job worth running: `just scan` otherwise writes
  # trivy.json, the SBOM and the archive into the runner's .cache/ and the runner
  # deletes them. Mirrors the upload-artifact step in .github/workflows/.
  artifacts:
    name: "delivery-$CI_COMMIT_SHA"
    paths:
      - .cache/delivery/
    expire_in: 90 days

# Monthly, via a pipeline schedule with REBUILD_SCAN=1. Rebuilding asks what
# Rocky published since; rescanning a stored archive would only ask what the
# vulnerability database learned. The RPM layer genuinely drifts, because
# `dnf -y install` is unpinned -- see the DL3041 note in scripts/lint.sh.
rebuild-scan:
  stage: image
  tags: [podman]
  timeout: 30m
  # No cache, unlike `image` above, and deliberately -- the note in
  # .github/workflows/scheduled.yml carries the measurement. This file has never
  # been executed, so its own numbers are unknown; it follows the GitHub side
  # rather than reasoning independently, which is this file's relationship to
  # that one throughout.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REBUILD_SCAN == "1"
  script:
    - *bootstrap
    - just mirror
    - just image
    - just scan
    - just bundle
  # What makes the rest of this job worth running: `just scan` otherwise writes
  # trivy.json, the SBOM and the archive into the runner's .cache/ and the runner
  # deletes them. Mirrors the upload-artifact step in .github/workflows/.
  artifacts:
    name: "delivery-$CI_COMMIT_SHA"
    paths:
      - .cache/delivery/
    expire_in: 90 days

