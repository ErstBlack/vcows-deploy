# Dependabot understands uv natively and drives the real uv CLI, so
# [dependency-groups] needs no separate parsing path.
#
# It is deliberately not pointed at the Containerfile. It handles the
# BASE_DIGEST pin well enough, but PROXMOXER_SHA256 is the digest of a downloaded
# artifact and nothing here can recompute it -- a bump that changed the version
# and left the digest would fail the build's own `sha256sum -c -`, which is the
# right outcome but a poor way to find out. That bump is a hand edit.
#
# GitLab has no equivalent. The closest is self-hosted Renovate on a schedule,
# with the same limitation.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
