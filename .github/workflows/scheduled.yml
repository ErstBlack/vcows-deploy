# Work that is worth doing regularly and is wrong as a pull-request gate.
#
# Mutation testing is deliberately absent. `just mutants` exists but `mutmut run`
# does not complete on this repo -- see the note in pyproject.toml -- and a
# scheduled job that always fails teaches people to ignore a red pipeline just as
# surely as one that always passes teaches them to trust a green one.
#
# It does not block anything. Nothing in a pipeline can fix a CVE in a pinned
# binary -- only a version bump can -- so a scheduled scan that goes red would be
# muted inside a month and then be green by neglect, which is the failure mode
# this repo already has a name for.
name: scheduled

on:
  schedule:
    # Monthly. Rebuilding asks what Rocky published since; rescanning a stored
    # archive would only ask what the vulnerability database learned. The RPM
    # layer genuinely drifts, because `dnf -y install` is unpinned -- see the
    # DL3041 note in scripts/lint.sh.
    #
    # The base layer does not drift, and this job cannot tell you when it should
    # have. `just image` builds from Containerfile's BASE_DIGEST, so every run
    # re-pulls the same bytes and rescans them against the same baseline --
    # which is exactly what makes a stale pin look healthy. `:10` floats across
    # Rocky minors and only the current minor is maintained, so the check this
    # job does not perform is the one in the comment above that ARG: compare
    # `:10`'s digest against the pin by hand, on the recheck date.
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

# scripts/install-tools.sh:6-11 refuses marketplace actions because they run
# "somebody else's code on the runner with the job's token". The tokens these
# jobs actually need is the smaller half of that: nothing here writes to the
# repository. `cache` and `upload-artifact` authenticate with the runner's own
# token rather than this one, so read is the whole requirement.
permissions:
  contents: read

jobs:
  rebuild-scan:
    runs-on: ubuntu-latest
    # No recent run to measure -- it is monthly -- but it does the image job's
    # work minus `just test-image`, so it gets the image job's ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      # No tool cache here, and that is the decision rather than the oversight it
      # looks like: ci.yml and image.yml both cache .tools/bin against the same
      # key. A cache earns its place by frequency, and this job runs twelve times
      # a year. Measured on the image job, which bootstraps identically --
      # install-tools.sh downloads all six in 5-7s, and restoring the 129 MB
      # cache takes 4s. One to three seconds, in a job where `just bundle` alone
      # is 47-67s.
      #
      # It would also usually miss. GitHub evicts a cache unused for seven days,
      # and the `tools-` key stays warm only while `check` keeps touching it on
      # every PR -- so on a quiet month this restores nothing, downloads anyway,
      # and pays a 2-3s save on top. Slower than having no cache block at all.
      - run: ./scripts/os-deps.sh
      - run: ./scripts/install-tools.sh
      - run: just dev-env
      - run: just mirror
      - run: just image
      - run: just scan
      - run: just bundle
      # The one step that makes the rest of this job worth running. Until now
      # `just scan` wrote trivy.json, the SBOM and the archive into the runner's
      # .cache/ and the runner deleted them, so the monthly rebuild proved
      # something and recorded nothing -- which removes the reason to run it
      # monthly, namely diffing this month's SBOM against last month's across an
      # unpinned `dnf -y install` layer.
      #
      # A `uses:`, so `workflows_carry_no_logic` in scripts/lint.sh still passes:
      # it inspects run/script/before_script/after_script and not uses.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: delivery-${{ github.sha }}
          path: .cache/delivery/
          if-no-files-found: error

