# Every step is a `just` recipe or one of the two bootstrap scripts that must run
# before `just` exists on a fresh runner. scripts/lint.sh asserts that, so this
# file can be deleted at the GitLab migration without taking any logic with it.
# .gitlab-ci.yml runs the same recipes.
#
# The image job lives in image.yml because it needs a path filter, which GitHub
# expresses per workflow rather than per job. No third-party actions: the pinned
# tool downloads in scripts/install-tools.sh verify their own digests, which is
# the standard the Containerfile already holds itself to.
name: ci

on:
  pull_request: {}
  push:
    branches: [master]

  # On demand, for a branch with no PR open yet. `push` is scoped to master
  # so a branch push does not run twice once a PR exists.
  workflow_dispatch: {}

# scripts/install-tools.sh refuses marketplace actions because they run
# "somebody else's code on the runner with the job's token". The tokens these
# jobs actually need is the smaller half of that: nothing here writes to the
# repository. `cache` and `upload-artifact` authenticate with the runner's own
# token rather than this one, so read is the whole requirement.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Measured over the last 25 runs: this workflow finishes in 40-51s. The
    # ceiling is sized against a wedge rather than a slow run -- `create` has no
    # timeout by design (a clock there kills a resumeless upload), so a hung run
    # otherwise holds a runner to GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .tools/bin
          key: tools-${{ hashFiles('scripts/install-tools.sh', 'Containerfile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .cache/uv
          key: uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: uv-
      - run: ./scripts/os-deps.sh
      - run: ./scripts/install-tools.sh
      - run: just dev-env
      - run: just check


  # Mutation testing, which asks the question coverage cannot: the suite executes
  # this line, but would it notice if the line were wrong? `just check` already
  # enforces a 90% coverage floor, and 964 of these mutants sit in code that floor
  # calls covered.
  #
  # It is a real gate, not a report. `mutmut run` exits 0 whatever it finds --
  # measured: 3835 mutants, 964 surviving, exit 0 -- so `scripts/mutants.sh`
  # compares against docs/mutation-baseline.json and fails only when a number
  # rose. Red means this change made the suite blinder, which is a question about
  # the change and belongs on the pull request rather than in a monthly job
  # nobody opens.
  #
  # Five shards of one run, summed by `mutation-verdict` below. Measured on run
  # 33800120376, before sharding: `just mutants` took 8m31s, of which generation
  # was 16s, the stats and clean and forced-fail runs 20s, and the mutant loop
  # 7m53s over 4983 mutants. The loop is 93% of the job, per-mutant fixed cost is
  # ~65 ms of warm pytest, and the only lever left is cores -- which on the Free
  # plan means more runners rather than a bigger one.
  mutation:
    runs-on: ubuntu-latest
    # `VCOWS_MUTANTS_SHARD=k/5` takes the mutants whose ordinal ends in a digit
    # `d` with `d % 5 == k-1`: one glob, no listing step, and the reasoning is in
    # the header of scripts/mutants.sh. Measured over 5008 mutants on a 16-core
    # box: 944/1060/1033/999/972 per shard, so the largest shard carries 21% of
    # the work rather than 20%.
    #
    # `fail-fast: false` because a red shard must not cancel the other four. The
    # verdict needs every shard's numbers, and a cancelled shard reaches it as a
    # smaller set of numbers, which is to say a better-looking one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # Still 30, and still sized against a wedge rather than a slow run, like
    # `check`'s: a shard is now a fifth of the work, not a fifth of the ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .tools/bin
          key: tools-${{ hashFiles('scripts/install-tools.sh', 'Containerfile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .cache/uv
          key: uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: uv-
      # **No `mutants/` cache, and that is the whole point of the job.** One used
      # to be restored here on the argument that a stale entry is only a verdict
      # mutmut recomputes, "because it hashes each function and resets anything
      # that moved". That is true of a source change and false of a test one:
      # mutmut hashes *source* functions, so a test-only commit leaves every hash
      # identical and every verdict is inherited. Measured on the branch that
      # became #156, which added twenty-two tests and touched no source:
      # `0.00 mutations/second`, and the survivor count reported was master's.
      #
      # It failed loudly there only because the number had gone *down*. The same
      # cache is silent in the direction that matters -- weaken a test, inherit
      # the old verdicts, and the gate is green. That is the vacuous pass
      # scripts/mutants.sh exists to catch, arriving through the cache.
      #
      # Keying on `tests/**` would fix this pipeline and not the GitLab one:
      # `cache:key:files` there takes at most two files and both are spent. So
      # the run is cold, always. Measured cold on a hosted runner: 8m48s, against
      # the 30-minute ceiling below.
      - run: ./scripts/os-deps.sh
      - run: ./scripts/install-tools.sh
      - run: just dev-env
      - run: just mutants
        env:
          VCOWS_MUTANTS_SHARD: ${{ matrix.shard }}/5
      # A shard judges nothing, because its numbers mean something only summed
      # with the other four, and matrix jobs share nothing but artifacts.
      # `if-no-files-found: error` for the reason `fail-fast: false` is set
      # above: a shard that reports nothing otherwise reaches the verdict as four
      # shards that add up to less, which is the vacuous pass scripts/mutants.sh
      # exists to catch. One day of retention because these files are a few
      # hundred bytes each and the repository's artifact quota is what disabled
      # the delivery upload in scheduled.yml.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mutation-stats-${{ matrix.shard }}
          path: .cache/mutation-stats/
          if-no-files-found: error
          retention-days: 1

  # Where a sharded run becomes a verdict. A job rather than a step because
  # matrix jobs share nothing but artifacts: each shard holds part of the count
  # and none of them can apply the gate.
  #
  # `just mutants-verdict` sums the five stats files and asserts the sum accounts
  # for every mutant mutmut generated. That equality is `generation_floor`'s
  # argument in sharded form -- it is what catches a shard that checked nothing
  # or an artifact that never arrived, neither of which any single shard can see.
  #
  # No `just dev-env` and no uv cache: the verdict is jq over five small files,
  # and it needs neither the venv nor a mutants/ tree.
  mutation-verdict:
    runs-on: ubuntu-latest
    needs: mutation
    # Nothing here runs a test -- it is the bootstrap plus jq -- so the ceiling
    # is sized against a wedge rather than a slow run, like `check`'s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .tools/bin
          key: tools-${{ hashFiles('scripts/install-tools.sh', 'Containerfile') }}
      - run: ./scripts/os-deps.sh
      - run: ./scripts/install-tools.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: mutation-stats-*
          merge-multiple: true
          path: .cache/mutation-stats
      - run: just mutants-verdict

  # The end-to-end gate. It deploys against a libvirtd installed on the runner
  # and asserts against `virsh dumpxml` and `qemu-img info` rather than against
  # what vcows rendered. The domain runs under TCG, so nothing here needs
  # /dev/kvm and the job is the same on a GitLab.com SaaS runner.
  smoke:
    runs-on: ubuntu-latest
    # Measured green: 1m11s (run 33439584490), of which apt is about 24s and the
    # whole apply-assert-destroy cycle is 16s. Was 1m05s and 10s before #122
    # moved the assertions into pytest; the added `just dev-env` and two pytest
    # startups are the difference. 30 rather than the 15 above, matching
    # the image job, because the ceiling is sized against a wedge rather than a
    # slow run -- a `create` stuck on a volume upload has no timeout of its
    # own, for the reason the check job's note gives.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .tools/bin
          key: tools-${{ hashFiles('scripts/install-tools.sh', 'Containerfile') }}
      - run: ./scripts/os-deps.sh
      - run: ./scripts/install-tools.sh
      # `just dev-env` is not optional here any more: the gate's assertions are
      # tests/test_libvirt_smoke.py, which the script runs out of this venv
      # (#122). os-deps.sh is needed for more than jq and xorriso for the same
      # reason -- it also brings python3-libvirt, and --system-site-packages is
      # what makes the binding visible to the venv.
      - run: just dev-env
      - run: just smoke-libvirt
